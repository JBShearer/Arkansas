*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--mono);font-size:16px;line-height:1.5}

.sub{color:var(--evil);font-size:13px;letter-spacing:.14em;font-weight:700}

button.on{background:var(--paper);color:var(--bg);border-color:var(--paper)}
button.go{background:var(--evil);border-color:var(--evil);color:#fff}
button.go:hover{filter:brightness(1.1)}
button.quiet{background:transparent;color:var(--dim);min-height:38px;padding:8px 10px;font-size:12px}
button.warn{border-color:var(--evil);color:var(--evil);background:transparent}

  // The instant in time for an Eastern wall-clock day and time.
  function etToUtc(day, hm) {
    const a = day.split('-').map(Number), b = hm.split(':').map(Number);
    const wall = Date.UTC(a[0], a[1] - 1, a[2], b[0], b[1]);
    let t = wall;
    for (let i = 0; i < 2; i++) {
      const p = {};
      for (const x of etFmt.formatToParts(new Date(t))) p[x.type] = x.value;
      t += wall - Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    }
    return new Date(t);
  }
  // A calendar file (.ics) that Outlook, Apple Calendar, and Google Calendar can open.
  function icsText(list, withTeam) {
    const pad = n => String(n).padStart(2, '0');
    const f = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
    const esc = v => String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = v => { const out = []; while (v.length > 73) { out.push(v.slice(0, 73)); v = ' ' + v.slice(73); } out.push(v); return out.join('\r\n'); };
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Evil Brain Labs//A&D AI Hackathon 2026//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    const stamp = f(new Date());
    for (const e of list) {
      const start = etToUtc(e.day, e.start), end = new Date(start.getTime() + e.minutes * 60000);
      const room = e.room || (withTeam ? null : myRoomOn(e.day));
      const where = e.location || (room ? 'Room ' + room : '');
      const desc = [e.host ? 'With ' + e.host : '', e.note || '', 'A&D AI Hackathon 2026, IBM One Madison'].filter(Boolean).join('\n');
      L.push('BEGIN:VEVENT', 'UID:session-' + e.id + '@easyassap.com', 'DTSTAMP:' + stamp, 'DTSTART:' + f(start), 'DTEND:' + f(end),
        fold('SUMMARY:' + esc(e.title + (withTeam && e.team ? ' (' + e.team + ')' : ''))));
      if (where) L.push(fold('LOCATION:' + esc(where)));
      L.push(fold('DESCRIPTION:' + esc(desc)), 'END:VEVENT');

    } catch (e) {}
  }

  // ---------------------------------------------------------------- boot
  let lastPub = 0, lastTeam = 0, lastCrew = 0, lastStaff = 0, lastCal = 0, lastUC = 0;
  async function tick() {
    const now = Date.now();
    const ae = document.activeElement;
    const crewIn = state.token && state.me && state.me.kind !== 'team';
    // A hidden tab, or an open picker, stops the usual refresh. With alerts on, the crew queue
    // is still checked (without redrawing the page) so a new request is never missed.
    if (document.hidden || (ae && (ae.tagName === 'SELECT' || ae.type === 'time'))) {
      if (state.alerts && crewIn && now - lastCrew > 10000) { lastCrew = now; loadCrew(false, !document.hidden); }
      return;
    }
    if (now - lastPub > 60000) { lastPub = now; loadPublic(false); }
    if (state.token && state.me) {
      if (state.me.kind === 'team' && now - lastTeam > 20000) { lastTeam = now; loadTeam(false); }
      if (state.me.kind !== 'team' && now - lastCrew > 10000) { lastCrew = now; loadCrew(false); }
      if (state.me.kind === 'staff' && state.tab === 'staff' && now - lastStaff > 30000) { lastStaff = now; loadStaff(false); }
      if (now - lastCal > 60000) { lastCal = now; loadCal(false); }
      if (now - lastUC > 60000 && (state.tab === 'uc' || (state.tab === 'crew' && state.crewTab === 'uc'))) { lastUC = now; loadUC(false); }
    }
  }
  async function boot() {
    if (FALLBACK && !state.pub) {
      // Show the schedule that shipped with the page at once. Live data replaces it when the server answers.
      state.pub = { schedule: FALLBACK.schedule, announcements: [], topics: FALLBACK.topics };
      pickDay();
      state.loaded = true;
    }
    render();
    lastPub = Date.now();
    await loadPublic(true);
    if (state.token) {
      await loadTeam(true);
      if (state.me) {
        state.tab = state.me.kind === 'team' ? 'team' : 'crew';
        if (state.me.kind === 'staff') await loadStaff(true);
        render();
        lastCal = Date.now();
        loadCal(true);
      }
    }
    setInterval(tick, 5000);
    setInterval(() => { if (!document.hidden && state.tab === 'schedule' && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key)) render(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { seen(); lastPub = lastTeam = lastCrew = lastStaff = lastCal = lastUC = 0; tick(); } });
    window.addEventListener('focus', seen);
    // Browsers only let sound start after a tap or a key press. After a reload, the first one turns it back on.
    document.addEventListener('pointerdown', () => { if (state.alerts) audioOn(); seen(); }, { passive: true });
  }
  boot();
})();
</script>
