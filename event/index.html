  // The instant in time for an Eastern wall-clock day and time.
  function etToUtc(day, hm) {
    const a = day.split('-').map(Number), b = hm.split(':').map(Number);

    let t = wall;
    for (let i = 0; i < 2; i++) {
      const p = {};
      for (const x of etFmt.formatToParts(new Date(t))) p[x.type] = x.value;
      t += wall - Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    }
    return new Date(t);
  }
  // A calendar file (.ics) that Outlook, Apple Calendar, and Google Calendar can open.
  function icsText(list, withTeam) {
    const pad = n => String(n).padStart(2, '0');
    const f = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
    const esc = v => String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = v => { const out = []; while (v.length > 73) { out.push(v.slice(0, 73)); v = ' ' + v.slice(73); } out.push(v); return out.join('\r\n'); };
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Evil Brain Labs//A&D AI Hackathon 2026//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    const stamp = f(new Date());
    for (const e of list) {
      const start = etToUtc(e.day, e.start), end = new Date(start.getTime() + e.minutes * 60000);
      const room = withTeam ? e.room : (state.me ? state.me.room : null);
      const where = e.location || (room ? 'Room ' + room : '');
      const desc = [e.host ? 'With ' + e.host : '', e.note || '', 'A&D AI Hackathon 2026, IBM One Madison'].filter(Boolean).join('\n');
      L.push('BEGIN:VEVENT', 'UID:session-' + e.id + '@easyassap.com', 'DTSTAMP:' + stamp, 'DTSTART:' + f(start), 'DTEND:' + f(end),
        fold('SUMMARY:' + esc(e.title + (withTeam && e.team ? ' (' + e.team + ')' : ''))));
      if (where) L.push(fold('LOCATION:' + esc(where)));
      L.push(fold('DESCRIPTION:' + esc(desc)), 'END:VEVENT');

  }

            it.location ? h('div', { class: 'loc' }, it.location) : null)))));

        h('div', { class: 'rowbtn' }, h('button', { type: 'button', id: 'pin-ack', onclick: () => { state.pinReveal = null; render(); } }, 'Got it'))));
    }
    out.push(h('div', { class: 'card' }, h('h2', null, 'POST AN ANNOUNCEMENT'),
      form(staffAnnounce,
        textarea('ann', { id: 'ann', maxlength: '280', placeholder: 'e.g., Lunch is up. Decks are due at 7:30 AM Thursday.', 'aria-label': 'Announcement', style: 'min-height:72px' }),
        h('div', { class: 'rowbtn' }, h('button', { type: 'submit', class: 'go', disabled: state.busy.ann, id: 'ann-go' }, 'Post to everyone')),
        errLine('ann')),
      s && s.announcements.length ? s.announcements.map(a => h('div', { class: 'door' },
        h('div', null, a.body), h('div', { class: 'muted' }, ago(a.at) + (a.active ? ' · showing' : ' · taken down')),
        a.active ? h('div', { class: 'rowbtn' }, h('button', { type: 'button', class: 'quiet', 'data-annoff': a.id, onclick: () => staffAnnounceOff(a.id) }, 'Take down')) : null)) : null));

    out.push(h('div', { class: 'card' }, h('h2', null, 'ADD A TEAM OR A PIN'),
      form(staffCreateDoor,
        h('label', { for: 'd_kind' }, 'TYPE'),
        select('d_kind', [{ value: 'team', label: 'Team (6-digit PIN)' }, { value: 'crew', label: 'Flight Crew (8-digit PIN)' }, { value: 'staff', label: 'Staff (8-digit PIN)' }], { id: 'd_kind' }),
        h('label', { for: 'd_name' }, 'NAME'), input('d_name', { id: 'd_name', maxlength: '60', placeholder: 'e.g., Team Falcon' }),
        state.drafts.d_kind === 'team' || !state.drafts.d_kind ? h('div', { class: 'grid2' },
          h('div', null, h('label', { for: 'd_room' }, 'ROOM'), input('d_room', { id: 'd_room', maxlength: '60' })),
          h('div', null, h('label', { for: 'd_coach' }, 'COACH'), input('d_coach', { id: 'd_coach', maxlength: '60' }))) : null,
        h('div', { class: 'rowbtn' }, h('button', { type: 'submit', class: 'go', disabled: state.busy.door, id: 'door-go' }, 'Create and show PIN')),
        errLine('door'))));

    out.push(h('div', { class: 'card', id: 'doors' }, h('h2', null, 'TEAMS AND PINS'), errLine('staff'),
      s ? s.doors.map(d => {
        const editing = state.editDoor === d.id;
        const mine = d.kind === 'staff' && d.name === state.me.name;
        return h('div', { class: 'door', 'data-door': d.name },
          h('div', null, h('span', { class: 'n' }, d.name), ' ', h('span', { class: 'st ' + (d.active ? 'claimed' : 'done') }, d.kind.toUpperCase() + (d.active ? '' : ' · OFF'))),
          h('div', { class: 'muted' }, (d.kind === 'team' ? (d.room ? 'Room ' + d.room : 'No room yet') + (d.coach ? ' · Coach: ' + d.coach : '') + ' · ' : '') + d.people + ' signed in' + (d.kind === 'team' ? ' · ' + d.open + ' open' : '')),
          editing ? form(() => staffSaveDoor(d.id),
            h('div', { class: 'grid2' },
              h('div', null, h('label', { for: 'e_room' }, 'ROOM'), input('e_room', { id: 'e_room', maxlength: '60' })),
              h('div', null, h('label', { for: 'e_coach' }, 'COACH'), input('e_coach', { id: 'e_coach', maxlength: '60' }))),
            h('label', { for: 'e_name' }, 'NAME'), input('e_name', { id: 'e_name', maxlength: '60' }),
            h('div', { class: 'rowbtn' }, h('button', { type: 'submit', class: 'go', 'data-act': 'save-door' }, 'Save'),
              h('button', { type: 'button', onclick: () => { state.editDoor = null; render(); } }, 'Never mind')))
          : h('div', { class: 'rowbtn' },
              h('button', { type: 'button', class: 'quiet', 'data-act': 'edit-door', onclick: () => { state.editDoor = d.id; state.drafts.e_room = d.room || ''; state.drafts.e_coach = d.coach || ''; state.drafts.e_name = d.name; render(); } }, 'Edit'),
              mine ? h('span', { class: 'muted', style: 'align-self:center' }, 'You are signed in through this one.') : [
              h('button', { type: 'button', class: 'quiet', 'data-act': 'reset-pin', onclick: () => twoTap('r' + d.id, () => staffResetPin(d)) }, state.confirm === 'r' + d.id ? 'Tap again: signs everyone out' : 'Reset PIN'),
              h('button', { type: 'button', class: 'quiet', 'data-act': 'toggle-door', onclick: () => twoTap('t' + d.id, () => staffToggleDoor(d)) }, state.confirm === 't' + d.id ? 'Tap again to confirm' : (d.active ? 'Turn off' : 'Turn on'))]));
      }) : h('p', { class: 'muted' }, 'Loading...')));
    return out;
  }

  

  // ---------------------------------------------------------------- boot
  let lastPub = 0, lastTeam = 0, lastCrew = 0, lastStaff = 0, lastCal = 0;
  async function tick() {
    if (document.hidden) return;
    const now = Date.now();
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'SELECT' || ae.type === 'time')) return;
    if (now - lastPub > 60000) { lastPub = now; loadPublic(false); }
    if (state.token && state.me) {
      if (state.me.kind === 'team' && now - lastTeam > 20000) { lastTeam = now; loadTeam(false); }
      if (state.me.kind !== 'team' && now - lastCrew > 10000) { lastCrew = now; loadCrew(false); }
      if (state.me.kind === 'staff' && state.tab === 'staff' && now - lastStaff > 30000) { lastStaff = now; loadStaff(false); }
      if (now - lastCal > 60000) { lastCal = now; loadCal(false); }
    }
  }
  async function boot() {
    if (FALLBACK && !state.pub) {
      // Show the schedule that shipped with the page at once. Live data replaces it when the server answers.
      state.pub = { schedule: FALLBACK.schedule, announcements: [], topics: FALLBACK.topics };
      pickDay();
      state.loaded = true;
    }
    render();
    lastPub = Date.now();
    await loadPublic(true);
    if (state.token) {
      await loadTeam(true);
      if (state.me) {
        state.tab = state.me.kind === 'team' ? 'team' : 'crew';
        if (state.me.kind === 'staff') await loadStaff(true);
        render();
        lastCal = Date.now();
        loadCal(true);
      }
    }
    setInterval(tick, 5000);
    setInterval(() => { if (!document.hidden && state.tab === 'schedule' && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key)) render(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastPub = lastTeam = lastCrew = lastStaff = lastCal = 0; tick(); } });
  }
  boot();
})();
</script>
</body>
</html>
